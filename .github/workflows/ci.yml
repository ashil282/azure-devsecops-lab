name: 1-ci (secrets, lint, test, SAST)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint (ruff, hadolint, yamllint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - run: pip install -r app/requirements-dev.txt yamllint

      - name: ruff
        run: ruff check app

      - name: yamllint
        run: yamllint -c .yamllint.yml k8s policies argocd .github

      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

  test:
    name: Unit tests + coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - run: pip install -r app/requirements-dev.txt

      - run: pytest app/tests --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  semgrep:
    name: SAST (Semgrep OSS)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    container:
      image: semgrep/semgrep:latest

    steps:
      - uses: actions/checkout@v7

      - name: Run Semgrep with community rules
        run: |
          semgrep scan \
            --config p/ci \
            --config p/python \
            --config p/dockerfile \
            --config p/kubernetes \
            --sarif \
            --output semgrep.sarif \
            --error \
            app Dockerfile k8s

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
