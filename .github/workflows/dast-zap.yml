name: 5-dast (OWASP ZAP baseline)

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 2"
  pull_request:
    paths: ["app/**", "Dockerfile"]

permissions:
  contents: read

jobs:
  zap-baseline:
    name: ZAP baseline scan against the running container
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build and run the app
        run: |
          docker build -t dast-target .
          docker run -d --name app -p 8080:8080 dast-target

          for i in $(seq 1 20); do
            curl -fs http://localhost:8080/healthz && break || sleep 2
          done

      - name: ZAP baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8080
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: true
          cmd_options: -a

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
