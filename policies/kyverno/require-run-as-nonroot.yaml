apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-run-as-nonroot
  annotations:
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["devsecops"]
      validate:
        message: "Pods must set runAsNonRoot: true."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
