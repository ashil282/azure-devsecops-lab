apiVersion: v1
kind: Service
metadata:
  name: devsecops-app
  namespace: devsecops
  labels:
    app.kubernetes.io/name: devsecops-app
spec:
  # NodePort + kind extraPortMappings (30080 -> localhost:8080) avoids running an ingress controller (saves RAM).
  type: NodePort
  selector:
    app.kubernetes.io/name: devsecops-app
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
