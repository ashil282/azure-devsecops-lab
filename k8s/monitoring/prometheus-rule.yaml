apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: enterprise-lab-alerts
  namespace: monitoring
  labels:
    release: monitoring
    app.kubernetes.io/part-of: azure-devsecops-lab
spec:
  groups:
  - name: KubernetesWorkloadAlerts
    rules:
    - alert: PodCrashLooping
      expr: rate(kube_pod_container_status_restarts_total[5m]) * 60 > 2
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: Pod crash looping detected (instance {{ $labels.instance }})
        description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} (container {{ $labels.container }}) is restarting more than twice per minute."
    
    - alert: KubernetesNodeNotReady
      expr: kube_node_status_condition{condition="Ready",status="true"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: Kubernetes node not ready (instance {{ $labels.node }})
        description: "Node {{ $labels.node }} has been in NotReady state for more than 1 minute."
