# k8s/monitoring/values.yaml
global:
  rbac:
    create: true

grafana:
  enabled: true
  adminPassword: "admin"
  service:
    type: ClusterIP
    port: 80
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

prometheus:
  prometheusSpec:
    retention: "7d"
    scrapeInterval: "30s"
    evaluationInterval: "30s"
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
